<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flight Distance Calculator</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    body {
      font-family: system-ui, sans-serif;
      padding: 1em;
      max-width: 600px;
      margin: auto;
      line-height: 1.5;
    }

    input, button {
      padding: 0.75em;
      width: 100%;
      margin-top: 0.5em;
      margin-bottom: 1em;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    small {
      display: block;
      color: gray;
      margin-bottom: 1em;
    }

    .location-box {
      margin-top: 1.5em;
      padding: 1em;
      background: #f0f0f0;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #121212;
        color: #e0e0e0;
      }

      input, button {
        background-color: #1e1e1e;
        color: #f0f0f0;
        border-color: #444;
      }

      .location-box {
        background: #1e1e1e;
        border: 1px solid #333;
      }
    }
  </style>
</head>
<body>
  <h1>Flight Distance Calculator</h1>
  <p>Calculate the flight (straight-line) distance between your location and a Google Maps link.</p>

  <label for="mapUrl"><strong>Google Maps URL:</strong></label>
  <input id="mapUrl" type="text" placeholder="Paste a full Google Maps URL here" />

  <small>
    If you have a <code>maps.app.goo.gl</code> short link, open it in a browser first and then copy the full link from the address bar.
  </small>

  <button onclick="calculateDistance()">Calculate Distance</button>

  <p id="output"></p>

  <div class="location-box" id="details" style="display:none;">
    <strong>Your Location:</strong>
    <p id="userAddress"></p>

    <strong>Destination Location:</strong>
    <p id="mapAddress"></p>
  </div>

  <script>
    function haversine(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const toRad = x => x * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                Math.sin(dLon / 2) ** 2;
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function extractCoords(url) {
      let match = url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || url.match(/q=(-?\d+\.\d+),(-?\d+\.\d+)/);
      if (match) {
        return { lat: parseFloat(match[1]), lon: parseFloat(match[2]) };
      }
      return null;
    }

    async function reverseGeocode(lat, lon) {
      const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`, {
        headers: { 'User-Agent': 'FlightDistanceCalc/1.0' }
      });
      const data = await res.json();
      return data.display_name || 'Unknown location';
    }

    async function calculateDistance() {
      const output = document.getElementById('output');
      const details = document.getElementById('details');
      const userAddress = document.getElementById('userAddress');
      const mapAddress = document.getElementById('mapAddress');

      const url = document.getElementById('mapUrl').value.trim();
      const dest = extractCoords(url);

      if (!dest) {
        output.textContent = 'Could not extract coordinates from the URL.';
        return;
      }

      if (!navigator.geolocation) {
        output.textContent = 'Geolocation is not supported by your browser.';
        return;
      }

      output.textContent = 'Getting your location...';
      details.style.display = 'none';

      navigator.geolocation.getCurrentPosition(async pos => {
        const userLat = pos.coords.latitude;
        const userLon = pos.coords.longitude;
        const dist = haversine(userLat, userLon, dest.lat, dest.lon);
        output.textContent = `Distance: ${dist.toFixed(2)} km`;

        const [userLoc, destLoc] = await Promise.all([
          reverseGeocode(userLat, userLon),
          reverseGeocode(dest.lat, dest.lon)
        ]);

        userAddress.textContent = userLoc;
        mapAddress.textContent = destLoc;
        details.style.display = 'block';
      }, err => {
        output.textContent = 'Error getting your location: ' + err.message;
      });
    }
  </script>
</body>
</html>
